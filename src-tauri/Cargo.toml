[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [ "tray-icon"] } # Mantenha as outras que já existirem lá
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
tokio = "1.52.3"
dirs = "5.0.1"
flate2 = "1.0"
tar = "0.4"
zip = "2.1"
tauri-plugin-dialog = "2"
